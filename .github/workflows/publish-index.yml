name: publish-index

on:
  push:
    branches:
      - main
    paths:
      - 'skills/*.json'

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild index.json
        run: |
          python3 -c "
import json, glob, os
from datetime import datetime, timezone

skills = []
for path in sorted(glob.glob('skills/*.json')):
    if os.path.basename(path) == '.gitkeep':
        continue
    try:
        with open(path) as f:
            entry = json.load(f)
        skills.append(entry)
    except Exception as e:
        print(f'Warning: skipping {path}: {e}')

index = {
    'version': 1,
    'generated_at': datetime.now(timezone.utc).isoformat(),
    'skill_count': len(skills),
    'skills': skills
}

with open('index.json', 'w') as f:
    json.dump(index, f, indent=2)
    f.write(chr(10))

print(f'index.json rebuilt with {len(skills)} skill(s)')
"

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged"
          else
            git commit -m "chore: rebuild index.json [skip ci]"
            git push
          fi
